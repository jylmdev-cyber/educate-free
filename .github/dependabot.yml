version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      react:
        patterns: [react, react-dom, "@types/react*", "@radix-ui/*"]
      tooling:
        patterns: [vite, "@vitejs/*", typescript, eslint, "@eslint/*", "typescript-eslint", "eslint-plugin-*", vitest, "@playwright/*", "@axe-core/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
